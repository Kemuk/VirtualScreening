# Snakemake SLURM Profile - Development/Testing (Snakemake 8.x)
# ==============================================================
# Usage: snakemake --profile workflow/profiles/slurm_devel --config mode=devel <target>
#
# This profile uses shorter time limits and the devel partition
# for quick turnaround during testing.

# Executor settings (Snakemake 8.x)
executor: slurm
jobs: 10                           # Max concurrent jobs
latency-wait: 5                    # Short wait time for devel
retries: 1                         # Fewer retries during testing
printshellcmds: true
keep-going: false                  # Stop on first failure during testing
slurm-logdir: "data/logs/slurm"

# Job naming - use rule name for descriptive squeue output
jobname: "vs-{rule}-{jobid}"

# Default resources - use devel partition with short times
default-resources:
  slurm_partition: "devel"
  mem_mb: 4000
  cpus_per_task: 2
  runtime: 10

# Per-rule resource overrides - all short times for testing
set-resources:
  # =========================================
  # Manifest Generation
  # =========================================
  create_manifest:
    slurm_partition: "devel"
    mem_mb: 32000
    cpus_per_task: 16
    runtime: 10

  # =========================================
  # Preparation
  # =========================================
  prepare_receptor:
    slurm_partition: "devel"
    mem_mb: 2000
    cpus_per_task: 1
    runtime: 10

  prepare_all:
    slurm_partition: "devel"
    mem_mb: 8000
    cpus_per_task: 4
    runtime: 10

  # =========================================
  # Docking
  # =========================================
  dock_ligand:
    slurm_partition: "devel"
    mem_mb: 16000
    cpus_per_task: 8
    runtime: 10

  dock_all:
    slurm_partition: "devel"
    cluster: "htc"
    mem_mb: 8000
    cpus_per_task: 2
    runtime: 60

  # =========================================
  # SDF Conversion
  # =========================================
  convert_to_sdf:
    slurm_partition: "devel"
    mem_mb: 4000
    cpus_per_task: 2
    runtime: 10

  convert_all:
    slurm_partition: "devel"
    mem_mb: 8000
    cpus_per_task: 4
    runtime: 10

  # =========================================
  # AEV-PLIG Rescoring
  # =========================================
  rescore_all:
    slurm_partition: "devel"
    cluster: "htc"
    mem_mb: 8000
    cpus_per_task: 2
    runtime: 10

  # =========================================
  # Results & Plotting
  # =========================================
  compute_results:
    slurm_partition: "devel"
    mem_mb: 8000
    cpus_per_task: 4
    runtime: 10

  make_plots:
    slurm_partition: "devel"
    mem_mb: 8000
    cpus_per_task: 4
    runtime: 10
